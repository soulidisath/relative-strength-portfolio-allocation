name: Generate example figures

on:
  push:
    paths:
      - "examples/cross_asset_demo.py"
      - "src/relative_strength.py"
      - "src/portfolio.py"
      - ".github/workflows/generate-example-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install example dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib yfinance

      - name: Generate figures
        run: python examples/cross_asset_demo.py

      - name: Commit refreshed figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/output/*.png
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Refresh reproducible example figures"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying."
              sleep 2
            done
            exit 1
          fi
